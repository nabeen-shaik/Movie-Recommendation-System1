<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - MovieRecommender</title>

    <style>

        /* =====================================================
           GLOBAL
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            min-height: 100vh;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;

            position: relative;

            overflow-x: hidden;

            background:

                linear-gradient(
                    rgba(2, 4, 15, 0.28),
                    rgba(2, 4, 15, 0.38)
                ),

                url("{{ url_for('static', filename='images/auth-bg.png') }}");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;
        }


        /* =====================================================
           DARK CINEMATIC OVERLAY
        ===================================================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            background:

                radial-gradient(
                    circle at center,
                    transparent 25%,
                    rgba(0, 0, 0, 0.18) 100%
                );

            pointer-events: none;

            z-index: 0;
        }


        /* =====================================================
           REGISTER CONTAINER
           
           Small + transparent
           No big solid rectangle
        ===================================================== */

        .register-card {

            width: 100%;

            max-width: 570px;

            padding: 30px 38px 28px;

            position: relative;

            z-index: 2;

            /*
               Very transparent glass
            */

            background:
                rgba(4, 12, 27, 0.30);

            border:
                1px solid
                rgba(255, 255, 255, 0.16);

            border-radius: 16px;

            /*
               Very small blur so background remains visible
            */

            backdrop-filter: blur(2px);

            -webkit-backdrop-filter: blur(2px);

            box-shadow:

                0 25px 70px
                rgba(0, 0, 0, 0.38),

                0 0 35px
                rgba(87, 55, 180, 0.08);
        }


        /* =====================================================
           LOGO SECTION
        ===================================================== */

        .logo-section {

            text-align: center;

            margin-bottom: 27px;
        }


        /* =====================================================
           LOGO IMAGE
           
           Using static/images/logo.png
        ===================================================== */

        .logo-image {

            width: 58px;

            height: 58px;

            margin:
                0 auto 12px;

            display: block;

            object-fit: contain;

            border-radius: 14px;

            filter:

                drop-shadow(
                    0 7px 18px
                    rgba(112, 72, 220, 0.35)
                );
        }


        /* =====================================================
           LOGO TEXT
        ===================================================== */

        .logo {

            font-size: 27px;

            font-weight: 700;

            color: white;

            line-height: 1.1;
        }


        .logo span {

            color: #8b5cf6;

            text-shadow:
                0 0 18px
                rgba(139, 92, 246, 0.28);
        }


        /* =====================================================
           TAGLINE
        ===================================================== */

        .tagline {

            margin-top: 7px;

            color: #b2bdcf;

            font-size: 13px;
        }


        /* =====================================================
           HEADING
        ===================================================== */

        .form-heading {

            margin-bottom: 21px;
        }


        .form-heading h2 {

            font-size: 23px;

            margin-bottom: 6px;

            color: #ffffff;
        }


        .form-heading p {

            color: #b1bdd0;

            font-size: 13px;

            line-height: 1.5;
        }


        /* =====================================================
           FORM GROUP
        ===================================================== */

        .form-group {

            margin-bottom: 15px;
        }


        .form-group label {

            display: block;

            color: #e0e5ee;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 7px;
        }


        /* =====================================================
           INPUT
        ===================================================== */

        .form-group input {

            width: 100%;

            height: 48px;

            padding:
                0 15px;

            border-radius: 8px;

            border:
                1px solid
                rgba(148, 163, 184, 0.40);

            outline: none;

            background:
                rgba(5, 18, 35, 0.63);

            color: white;

            font-size: 14px;

            transition:
                0.2s ease;
        }


        .form-group input::placeholder {

            color: #8492a8;
        }


        .form-group input:hover {

            border-color:
                rgba(139, 92, 246, 0.55);
        }


        .form-group input:focus {

            border-color:
                #8b5cf6;

            background:
                rgba(7, 21, 40, 0.76);

            box-shadow:

                0 0 0 2px
                rgba(139, 92, 246, 0.12),

                0 0 15px
                rgba(139, 92, 246, 0.08);
        }


        /* =====================================================
           ERROR
        ===================================================== */

        .error {

            background:
                rgba(239, 68, 68, 0.12);

            border:
                1px solid
                rgba(239, 68, 68, 0.35);

            color: #fca5a5;

            padding:
                10px 12px;

            border-radius: 7px;

            margin-bottom: 15px;

            font-size: 13px;
        }


        /* =====================================================
           SUCCESS
        ===================================================== */

        .success {

            background:
                rgba(34, 197, 94, 0.12);

            border:
                1px solid
                rgba(34, 197, 94, 0.35);

            color: #86efac;

            padding:
                10px 12px;

            border-radius: 7px;

            margin-bottom: 15px;

            font-size: 13px;
        }


        /* =====================================================
           CREATE BUTTON
        ===================================================== */

        .create-btn {

            width: 100%;

            height: 49px;

            border: none;

            border-radius: 8px;

            background:

                linear-gradient(
                    135deg,
                    #7048dc,
                    #8455ec
                );

            color: white;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 3px;

            transition:
                0.2s ease;

            box-shadow:

                0 7px 22px
                rgba(112, 72, 220, 0.25);
        }


        .create-btn:hover {

            background:

                linear-gradient(
                    135deg,
                    #7b50e7,
                    #915ff5
                );

            transform:
                translateY(-1px);

            box-shadow:

                0 10px 27px
                rgba(112, 72, 220, 0.35);
        }


        .create-btn:active {

            transform:
                translateY(0);
        }


        /* =====================================================
           LOGIN LINK
        ===================================================== */

        .login-link {

            text-align: center;

            margin-top: 18px;

            color: #aab5c7;

            font-size: 13px;
        }


        .login-link a {

            color: #a78bfa;

            text-decoration: none;

            font-weight: 600;

            margin-left: 4px;
        }


        .login-link a:hover {

            color: #c4b5fd;

            text-decoration: underline;
        }


        /* =====================================================
           HOME LINK
        ===================================================== */

        .home-link {

            display: block;

            text-align: center;

            margin-top: 15px;

            color: #8793a6;

            text-decoration: none;

            font-size: 13px;

            transition: 0.2s;
        }


        .home-link:hover {

            color: #b59cff;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 650px) {

            body {

                padding:
                    18px;

                background-attachment:
                    scroll;
            }


            .register-card {

                max-width: 100%;

                padding:
                    28px 24px;

                background:
                    rgba(4, 12, 27, 0.38);
            }


            .logo-image {

                width: 54px;

                height: 54px;
            }


            .logo {

                font-size: 24px;
            }


            .form-heading h2 {

                font-size: 21px;
            }
        }


        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 420px) {

            body {

                padding:
                    10px;
            }


            .register-card {

                padding:
                    25px 18px;
            }


            .logo-image {

                width: 50px;

                height: 50px;
            }


            .logo {

                font-size: 21px;
            }


            .form-heading p {

                font-size: 12px;
            }


            .form-group input {

                height: 46px;

                font-size: 13px;
            }


            .create-btn {

                height: 47px;
            }
        }

    </style>

</head>


<body>


    <!-- =================================================
         REGISTER CARD
    ================================================= -->

    <div class="register-card">


        <!-- =================================================
             LOGO
        ================================================= -->

        <div class="logo-section">


            <img
                src="{{ url_for('static', filename='images/logo.png') }}"
                alt="MovieRecommender Logo"
                class="logo-image"
            >


            <div class="logo">

                Movie<span>Recommender</span>

            </div>


            <div class="tagline">

                Create your account

            </div>


        </div>


        <!-- =================================================
             HEADING
        ================================================= -->

        <div class="form-heading">

            <h2>
                Create Account
            </h2>


            <p>
                Register to get personalized movie recommendations.
            </p>

        </div>


        <!-- =================================================
             ERROR
        ================================================= -->

        {% if error %}

        <div class="error">

            {{ error }}

        </div>

        {% endif %}


        <!-- =================================================
             SUCCESS
        ================================================= -->

        {% if success %}

        <div class="success">

            {{ success }}

        </div>

        {% endif %}


        <!-- =================================================
             REGISTER FORM
        ================================================= -->

        <form
            action="{{ url_for('register') }}"
            method="POST"
        >


            <!-- USERNAME -->

            <div class="form-group">

                <label>
                    Username
                </label>


                <input
                    type="text"
                    name="name"
                    placeholder="Enter your username"
                    required
                    autocomplete="name"
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email
                </label>


                <input
                    type="email"
                    name="email"
                    placeholder="Enter email address"
                    required
                    autocomplete="email"
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label>
                    Password
                </label>


                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                    autocomplete="new-password"
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label>
                    Confirm Password
                </label>


                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                    autocomplete="new-password"
                >

            </div>


            <!-- CREATE ACCOUNT -->

            <button
                type="submit"
                class="create-btn"
            >

                Create Account

            </button>


        </form>


        <!-- =================================================
             LOGIN
        ================================================= -->

        <div class="login-link">

            Already have an account?

            <a
                href="{{ url_for('user_login') }}"
            >
                Login
            </a>

        </div>


        <!-- =================================================
             HOME
        ================================================= -->

        <a
            href="{{ url_for('home') }}"
            class="home-link"
        >

            ← Back to Home

        </a>


    </div>


</body>

</html>
