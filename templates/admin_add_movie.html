<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Add Movie - MovieRecommender</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    color: #20242c;
}

.container {
    max-width: 850px;
    margin: 40px auto;
    padding: 0 20px;
}

.header {
    margin-bottom: 25px;
}

.header h1 {
    font-size: 25px;
}

.header p {
    color: #8c939f;
    font-size: 12px;
    margin-top: 6px;
}

.card {
    background: white;
    border: 1px solid #e5e8ef;
    border-radius: 12px;
    padding: 30px;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 7px;
}

input,
textarea {
    width: 100%;
    border: 1px solid #dfe3ea;
    border-radius: 7px;
    padding: 12px;
    outline: none;
    font-size: 12px;
}

input:focus,
textarea:focus {
    border-color: #7057d9;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

.error {
    background: #fff0f0;
    color: #df5a5a;
    border: 1px solid #ffd5d5;
    padding: 12px;
    border-radius: 7px;
    margin-bottom: 20px;
    font-size: 12px;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

button,
.back-btn {
    border: none;
    padding: 11px 20px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 12px;
    text-decoration: none;
}

.save-btn {
    background: #7057d9;
    color: white;
}

.save-btn:hover {
    background: #6048c5;
}

.back-btn {
    background: #eef0f5;
    color: #555d69;
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>
            Add New Movie
        </h1>

        <p>
            Add a new movie to the recommendation dataset.
        </p>

    </div>


    <div class="card">


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">


            <div class="form-group">

                <label>
                    Movie Title *
                </label>

                <input
                    type="text"
                    name="title"
                    placeholder="Enter movie title"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Genres
                </label>

                <input
                    type="text"
                    name="genres"
                    placeholder="Example: Action Adventure Fantasy"
                >

            </div>


            <div class="form-group">

                <label>
                    Rating
                </label>

                <input
                    type="number"
                    name="rating"
                    placeholder="Example: 8.5"
                    min="0"
                    max="10"
                    step="0.1"
                >

            </div>


            <div class="form-group">

                <label>
                    Poster URL
                </label>

                <input
                    type="text"
                    name="poster_url"
                    placeholder="https://..."
                >

            </div>


            <div class="form-group">

                <label>
                    Overview
                </label>

                <textarea
                    name="overview"
                    placeholder="Enter movie description..."
                ></textarea>

            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="save-btn"
                >
                    + Add Movie
                </button>


                <a
                    href="/admin/movies"
                    class="back-btn"
                >
                    Cancel
                </a>

            </div>


        </form>


    </div>

</div>

</body>

</html>
